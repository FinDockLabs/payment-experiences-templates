<template>
    <!--
        flow-api-name: API name of the screen flow to run. It comes from the public flowApiName
        property, which Lightning Out exposes as the flow-api-name attribute on the host website:
            <c-lightning-out-flow-container flow-api-name="Donation_Flow"></c-lightning-out-flow-container>
        It can also be set from website JavaScript with setAttribute, or as a Custom Property
        in Lightning Out 2.0 App Manager ({ "flow-api-name": "Donation_Flow" }).
        success-url, failure-url (optional): full URLs where the payer goes after a successful or
        a failed payment. Set either the same way; each one that is set is passed to the flow's
        successUrl or failureUrl input variable, so the flow must have that input. The FinDock flow
        templates do; without them they use https://www.example.com/success and /failure.
        input-variables (optional): other String inputs for the flow, as a JSON object, e.g.
            input-variables='{"id": "<GUID>", "type": "link"}'
        Each one is passed to the flow input variable with that name, so the flow must have it.
        flow-class (optional): class around the flow, for a site template's stylesheet: donation-flow
        (canopyStyles), checkout-flow or payment-link-flow (checkoutStyles).
        Docs: TODO add docs link

        onstatuschange: reports the height once each new screen has rendered (auto-sizing).
    -->
    <div class={flowClass}>
        <lightning-flow
            flow-api-name={flowApiName}
            flow-input-variables={flowInputVariables}
            onstatuschange={handleStatusChange}>
        </lightning-flow>
    </div>
</template>
